[package]
name = "aim_trainer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_text",
    "bevy_ui_render",
    "default_font",
    "png",
    "hdr",
    "ktx2",
    "tonemapping_luts",
    "zstd_rust",
    "bevy_mikktspace",
] }
bevy_egui = "=0.43.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"
dirs = "=7.0.0"
ron = "=0.12.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
